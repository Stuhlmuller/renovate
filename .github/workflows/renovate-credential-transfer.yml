name: Renovate Credential Transfer

# checkov:skip=CKV_GHA_7: expected_sha pins a reviewed current main commit; SSM destinations are fixed.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing this reviewed transfer workflow
        required: true
        type: string

permissions: {}

concurrency:
  group: renovate-credential-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'Stuhlmuller/renovate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact current main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = refs/heads/main
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ACTUAL_SHA"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/renovate.git refs/heads/main | cut -f1)"
          test "$ACTUAL_SHA" = "$current_main_sha"

      - name: Verify existing Renovate App credentials
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          owner: Stuhlmuller

      - name: Assume dedicated transfer role
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: renovate-transfer-${{ github.run_id }}
          role-to-assume: arn:aws:iam::716182248480:role/homelab-renovate-credential-transfer
          unset-current-credentials: true

      - name: Transfer only the existing App credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          RENOVATE_PRIVATE_KEY: ${{ secrets.RENOVATE_PRIVATE_KEY }}
        run: python3 -I scripts/renovate-credential-transfer.py
