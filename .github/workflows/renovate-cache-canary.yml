name: Renovate Cache Canary Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing this reviewed workflow
        required: true
        type: string
      version:
        description: Fixed canary release to publish
        required: true
        type: choice
        options:
          - v0.0.1
          - v0.0.2

permissions: {}

concurrency:
  group: renovate-cache-canary-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Stuhlmuller/renovate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact current main and fixed release state
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          case "$VERSION" in
            v0.0.1|v0.0.2) ;;
            *) exit 1 ;;
          esac
          require_absent() {
            response="$(gh api -i "repos/${GITHUB_REPOSITORY}/$1" 2>/dev/null || true)"
            first_line="${response%%$'\n'*}"
            case "$first_line" in
              HTTP/*" 404 Not Found") ;;
              *) echo "Canary tag or release exists, or lookup failed" >&2; exit 1 ;;
            esac
          }
          require_absent "git/ref/tags/$VERSION"
          require_absent "releases/tags/$VERSION"
          if test "$VERSION" = v0.0.2; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.0.1" --jq '.draft == false and .prerelease == false')" = true
          fi

      - name: Publish the reviewed canary release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Renovate cache canary $VERSION" \
            --notes "Temporary controlled release for the homelab Renovate cache freshness check."
